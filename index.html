<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevCanvas - Browser-Based Web Development Playground">
  <title>DevCanvas</title>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-section">
        <a href="#dashboard" class="brand">
          <div class="brand-mark">&lt;/&gt;</div>
          <span>DevCanvas</span>
        </a>

        <nav class="navigation">
          <a href="#dashboard" class="nav-link active" data-route="dashboard">Dashboard</a>
          <a href="#workspace" class="nav-link" data-route="workspace">Workspace</a>
          <a href="#settings" class="nav-link" data-route="settings">Settings</a>
        </nav>
      </div>

      <div class="topbar-actions">
        <button class="secondary-button">Import</button>
        <button id="new-project-button" class="primary-button">+ New Project</button>
      </div>
    </header>

    <main class="main">
      <div class="page-header">
        <div>
          <h1 id="page-title">Dashboard</h1>
          <p id="page-description">Manage your DevCanvas projects.</p>
        </div>
      </div>

      <section id="view-container" class="content"></section>
    </main>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>

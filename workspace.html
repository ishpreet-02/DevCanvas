<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevCanvas Workspace">
  <title>DevCanvas | Workspace</title>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
  <link rel="stylesheet" href="./css/components.css">
</head>

<body class="workspace-page">
  <div class="app">
    <header class="topbar">
      <div class="brand-section">
        <a href="./index.html" class="brand">
          <div class="brand-mark">&lt;/&gt;</div>
          <span>DevCanvas</span>
        </a>

        <nav class="navigation">
          <a href="./index.html" class="nav-link" id="dashboard-link">Dashboard</a>
          <a href="./workspace.html" class="nav-link active">Workspace</a>
          <a href="./settings.html" class="nav-link">Settings</a>
        </nav>
      </div>

      <div class="topbar-actions">
        <button class="secondary-button" id="import-files-button">
          Import
        </button>

        <button class="secondary-button" id="export-project-button">
          Export
        </button>

        <button class="secondary-button" id="rename-button">
          Rename
        </button>

        <button class="secondary-button" id="save-button">
          Save
        </button>

        <button class="primary-button" id="run-button">
          Run
        </button>
      </div>
    </header>

    <main class="workspace-main">
      <div class="workspace-toolbar">
        <div>
          <h1 id="project-name">Untitled Project</h1>
          <p>HTML · CSS · JavaScript</p>
        </div>

        <div class="workspace-status">
          <span class="status-dot unsaved" id="status-dot"></span>
          <span id="save-status">Loading...</span>
        </div>
      </div>

      <div class="workspace-stage">
        <section class="workspace-layout">
          <div class="editor-panel">
            <div class="panel-header">
              <div class="editor-tabs">
                <button class="editor-tab active" data-editor="html">HTML</button>
                <button class="editor-tab" data-editor="css">CSS</button>
                <button class="editor-tab" data-editor="javascript">JavaScript</button>
              </div>

              <div class="editor-actions">
                <button class="small-button" id="copy-code-button">Copy</button>
                <span class="panel-label">Editor</span>
              </div>
            </div>

            <div class="editor-container">
              <textarea id="html-editor" class="code-editor active"></textarea>
              <textarea id="css-editor" class="code-editor"></textarea>
              <textarea id="javascript-editor" class="code-editor"></textarea>
            </div>
          </div>

          <div class="preview-panel">
            <div class="panel-header">
              <span>Live Preview</span>

              <div class="preview-actions">
                <button
                  class="console-icon-button"
                  id="console-toggle-button"
                  aria-label="Open Console"
                  data-tooltip="Open Console">
                  &gt;_
                </button>

                <button class="small-button preview-size-button active" data-preview-size="desktop">
                  Desktop
                </button>

                <button class="small-button preview-size-button" data-preview-size="tablet">
                  Tablet · 768
                </button>

                <button class="small-button preview-size-button" data-preview-size="mobile">
                  Mobile · 375
                </button>
              </div>
            </div>

            <div class="preview-viewport">
              <div class="preview-device desktop" id="preview-device">
                <iframe
                  id="preview-frame"
                  class="preview-frame"
                  sandbox="allow-scripts"
                  title="DevCanvas Preview">
                </iframe>
              </div>
            </div>
          </div>
        </section>

        <section class="console-drawer" id="console-drawer">
          <div class="console-header">
            <div class="console-title">
              <span class="console-indicator"></span>
              <span>Console</span>
              <span class="console-count" id="console-count">0</span>
            </div>

            <div class="console-actions">
              <button class="console-action-button" id="clear-console-button">Clear</button>
              <button class="console-action-button" id="expand-console-button" title="Expand console">↕</button>
              <button class="console-action-button" id="close-console-button" title="Close console">×</button>
            </div>
          </div>

          <div class="console-output" id="console-output">
            <div class="console-empty">
              Console output will appear here.
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <dialog class="project-dialog" id="rename-dialog">
    <form id="rename-form">
      <div class="dialog-header">
        <h2>Rename Project</h2>
        <p>Choose a new name for your DevCanvas project.</p>
      </div>

      <div class="dialog-body">
        <div class="form-group">
          <label for="rename-project-name">Project Name</label>

          <input
            type="text"
            id="rename-project-name"
            class="form-input"
            maxlength="60"
            autocomplete="off"
            required>
        </div>
      </div>

      <div class="dialog-actions">
        <button type="button" class="secondary-button" id="cancel-rename-button">
          Cancel
        </button>

        <button type="submit" class="primary-button">
          Rename
        </button>
      </div>
    </form>
  </dialog>
  <input
    type="file"
    id="workspace-file-input"
    accept=".html,.css,.js"
    multiple
    hidden>
  <script type="module" src="./js/workspace.js"></script>
</body>
</html>

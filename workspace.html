<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="DevCanvas Workspace">
  <title>DevCanvas | Workspace</title>

  <link rel="stylesheet" href="./css/variables.css">
  <link rel="stylesheet" href="./css/base.css">
  <link rel="stylesheet" href="./css/layout.css">
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand-section">
        <a href="./index.html" class="brand">
          <div class="brand-mark">&lt;/&gt;</div>
          <span>DevCanvas</span>
        </a>

        <nav class="navigation">
          <a href="./index.html" class="nav-link">Dashboard</a>
          <a href="./workspace.html" class="nav-link active">Workspace</a>
          <a href="./settings.html" class="nav-link">Settings</a>
        </nav>
      </div>

      <div class="topbar-actions">
        <button class="secondary-button" id="save-button">Save</button>
        <button class="primary-button" id="run-button">Run</button>
      </div>
    </header>

    <main class="workspace-main">
      <div class="workspace-toolbar">
        <div>
          <h1>Untitled Project</h1>
          <p>HTML · CSS · JavaScript</p>
        </div>

        <div class="workspace-status">
          <span class="status-dot"></span>
          <span id="save-status">Not saved yet</span>
        </div>
      </div>

      <section class="workspace-layout">
        <div class="editor-panel">
          <div class="panel-header">
            <div class="editor-tabs">
              <button class="editor-tab active" data-editor="html">HTML</button>
              <button class="editor-tab" data-editor="css">CSS</button>
              <button class="editor-tab" data-editor="javascript">JavaScript</button>
            </div>

            <span class="panel-label">Editor</span>
          </div>

          <div class="editor-container">
            <textarea id="html-editor" class="code-editor active"><h1>Hello DevCanvas</h1>
<p>Start building your project.</p></textarea>

            <textarea id="css-editor" class="code-editor">body {
  font-family: Arial, sans-serif;
  text-align: center;
  padding: 40px;
}

h1 {
  color: #2563eb;
}</textarea>

            <textarea id="javascript-editor" class="code-editor">console.log("DevCanvas is running");</textarea>
          </div>
        </div>

        <div class="preview-panel">
          <div class="panel-header">
            <span>Live Preview</span>

            <div class="preview-actions">
              <button class="small-button active">Desktop</button>
              <button class="small-button">Tablet</button>
              <button class="small-button">Mobile</button>
            </div>
          </div>

          <iframe
            id="preview-frame"
            class="preview-frame"
            sandbox="allow-scripts"
            title="DevCanvas Preview">
          </iframe>
        </div>
      </section>

      <section class="console-panel">
        <div class="panel-header">
          <span>Console</span>
          <button class="small-button" id="clear-console-button">Clear</button>
        </div>

        <div class="console-placeholder" id="console-output">
          <p>&gt; Console output will appear here.</p>
        </div>
      </section>
    </main>
  </div>

  <script type="module" src="./js/workspace.js"></script>
</body>
</html>
